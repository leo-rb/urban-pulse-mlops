version: '3.8'

services:
  # --- 1. Base de données ---
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: urban_user
      POSTGRES_PASSWORD: urban_password
      POSTGRES_DB: urban_pulse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # 👇 C'est cette ligne qu'il faut corriger !
      test: ["CMD-SHELL", "pg_isready -U urban_user -d urban_pulse_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- 2. Interface Admin DB ---
  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db

  # --- 3. Stockage MinIO ---
  minio:
    image: minio/minio
    container_name: urban_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    # 👇 AJOUTE CE BLOC 👇
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # --- 4. Serveur MLflow ---
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: urban_mlflow
    restart: always
    ports:
      - "5000:5000"
    environment:
      # ✅ ICI : On force les valeurs en dur
      MLFLOW_BACKEND_STORE_URI: postgresql://urban_user:urban_password@db:5432/urban_pulse_db
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
    command: >
      mlflow server
      --backend-store-uri postgresql://urban_user:urban_password@db:5432/urban_pulse_db
      --default-artifact-root s3://mlflow/
      --host 0.0.0.0
      --port 5000
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  # --- 5. APP : Générateur de données ---
  generator:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: urban_generator
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - POSTGRES_USER=urban_user
      - POSTGRES_PASSWORD=urban_password
      - POSTGRES_DB=urban_pulse_db
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_DEFAULT_REGION=us-east-1
    depends_on:
      db:
        condition: service_healthy
    # 👇 LA LIGNE MAGIQUE ICI 👇
    command: sh -c "python src/ingestion/mock_generator.py ; tail -f /dev/null"

  # --- 6. APP : API de Prédiction ---
  api:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: urban_api
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=urban_pulse_db
      - DB_USER=urban_user
      - POSTGRES_PASSWORD=urban_password  # 👈 AJOUTE ÇA
      - MLFLOW_TRACKING_URI=http://mlflow:5000}
    command: uvicorn src.app.api:app --host 0.0.0.0 --port 8000
    depends_on:
      - mlflow

  # --- 7. APP : Dashboard Streamlit ---
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: urban_dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
      - DB_HOST=db
      - DB_NAME=urban_pulse_db
      - DB_USER=urban_user
      - POSTGRES_PASSWORD=urban_password
    command: streamlit run src/app/dashboard.py
    depends_on:
      - db
      - api

volumes:
  postgres_data:
  minio_data: