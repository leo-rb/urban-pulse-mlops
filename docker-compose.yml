version: '3.8'

services:
  # ---------------------------------------------------
  # 1. BASE DE DONNÉES (PostgreSQL)
  # ---------------------------------------------------
  db:
    image: postgres:15
    container_name: urban_pulse_db  # Nom explicite pour éviter les confusions
    restart: always
    environment:
      POSTGRES_USER: urban_user
      POSTGRES_PASSWORD: urban_password
      POSTGRES_DB: urban_pulse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Vérifie la connexion avec le bon utilisateur/DB
      test: ["CMD-SHELL", "pg_isready -U urban_user -d urban_pulse_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------
  # 2. STOCKAGE S3 (MinIO)
  # ---------------------------------------------------
  minio:
    image: minio/minio
    container_name: urban_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ---------------------------------------------------
  # 3. MLFLOW (Tracking des modèles)
  # ---------------------------------------------------
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: urban_mlflow
    restart: always
    ports:
      - "5000:5000"
    environment:
      # Connexion DB
      MLFLOW_BACKEND_STORE_URI: postgresql://urban_user:urban_password@db:5432/urban_pulse_db
      # Connexion MinIO
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
    command: >
      mlflow server
      --backend-store-uri postgresql://urban_user:urban_password@db:5432/urban_pulse_db
      --default-artifact-root s3://mlflow/
      --host 0.0.0.0
      --port 5000
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ---------------------------------------------------
  # 4. GÉNÉRATEUR DE DONNÉES (Ingestion)
  # ---------------------------------------------------
  generator:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: urban_generator
    environment:
      - PYTHONUNBUFFERED=1  # Important : Affiche les logs en direct
      - DB_HOST=db
      - DB_PORT=5432
      - POSTGRES_USER=urban_user
      - POSTGRES_PASSWORD=urban_password
      - POSTGRES_DB=urban_pulse_db
      # Variables pour l'entraînement (MLflow/S3)
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_DEFAULT_REGION=us-east-1
    # Lance le script ET garde le conteneur allumé (tail -f)
    command: sh -c "python src/ingestion/mock_generator.py ; tail -f /dev/null"
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------
  # 5. API (FastAPI)
  # ---------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: urban_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=urban_pulse_db
      - DB_USER=urban_user
      - POSTGRES_PASSWORD=urban_password
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_DEFAULT_REGION=us-east-1
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------
  # 6. DASHBOARD (Streamlit)
  # ---------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: urban_dashboard
    restart: always
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
      - DB_HOST=db
      - DB_NAME=urban_pulse_db
      - DB_USER=urban_user
      - POSTGRES_PASSWORD=urban_password # ✅ CORRECTION DASHBOARD
    depends_on:
      api:
        condition: service_started

  # ---------------------------------------------------
  # 7. ADMINER (Interface DB - Optionnel mais utile)
  # ---------------------------------------------------
  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  minio_data: